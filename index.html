
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Learner Safety QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f0fdf4;
  color: #14532d;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: 20px auto;
  padding: 24px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0001;
}

h1 { font-size: 23px; }

#reader {
  width: 100%;
  margin: 20px auto;
}

button {
  padding: 13px 20px;
  margin: 5px;
  border: none;
  border-radius: 9px;
  background: #166534;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  margin: 18px 0;
  padding: 15px;
  border-radius: 10px;
  background: #f1f5f9;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.success {
  background: #dcfce7 !important;
  color: #166534;
}

.error {
  background: #fee2e2 !important;
  color: #991b1b;
}

.note {
  font-size: 13px;
  color: #64748b;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

  <h1>LEARNER SAFETY</h1>
  <h3>QR CODE SCANNER</h3>

  <p>Scan the learner's official QR code.</p>

  <div id="reader"></div>

  <div id="status">
    Ready to scan.
  </div>

  <button id="startButton" onclick="startScanner()">
    START CAMERA
  </button>

  <button id="stopButton" onclick="stopScanner()">
    STOP CAMERA
  </button>

  <button id="againButton" onclick="scanAgain()" hidden>
    SCAN ANOTHER LEARNER
  </button>

  <p class="note">
    Allow camera access when requested.
    Keep this page open while processing the learner's
    safety record.
  </p>

</div>

<script>

// YOUR EXISTING GOOGLE APPS SCRIPT DEPLOYMENT
const GAS_URL =
'https://script.google.com/macros/s/AKfycbyPO1z5UPQ6fJn9TKUZz4cIYD3N4-gxa8DTDm_v-pvbUsEnX3cZNpVlurgiDXQIt2h5/exec';
  
let scanner = null;
let scanning = false;
let processing = false;

function showStatus(message, type) {
  const box = document.getElementById('status');

  box.className = type || '';
  box.textContent = message;
}

async function startScanner() {

  if (processing || scanning) return;

  showStatus('Opening camera...', '');

  try {
    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess,
      function() {}
    );

    scanning = true;

    document.getElementById('startButton').disabled = true;

    showStatus(
      'CAMERA ACTIVE. Please scan a learner QR code.',
      ''
    );

  } catch (error) {
    showStatus(
      'CAMERA ERROR: ' + String(error),
      'error'
    );
  }
}

async function stopScanner() {

  if (scanner && scanning) {
    try {
      await scanner.stop();
      scanning = false;
    } catch (error) {
      console.log(error);
    }
  }

  document.getElementById('startButton').disabled = false;
}

function extractToken(text) {

  let url;

  try {
    url = new URL(text);
  } catch (error) {
    throw new Error('Invalid QR code.');
  }

  // Only accept our Apps Script or GitHub scanner URLs.
  const allowed =
    url.origin === 'https://script.google.com' ||
    url.origin === 'https://phbsantos97.github.io';

  if (!allowed) {
    throw new Error('This is not an official learner QR code.');
  }

  const token = url.searchParams.get('token');

  if (!token || !/^[a-f0-9-]{36}$/i.test(token)) {
    throw new Error('Invalid learner QR token.');
  }

  return token;
}

async function onScanSuccess(decodedText) {

  if (processing) return;

  let token;

  try {
    token = extractToken(decodedText);
  } catch (error) {
    showStatus(error.message, 'error');
    return;
  }

  processing = true;

  await stopScanner();

  document.getElementById('againButton').hidden = true;

  showStatus(
    'QR CODE RECOGNIZED. Updating learner safety record...',
    ''
  );

  requestSafetyUpdate(token);
}

// JSONP: no cross-origin fetch required.

function requestSafetyUpdate(token) {

  const callbackName =
    'learnerSafetyResponse_' + Date.now();

  let finished = false;

  const script = document.createElement('script');

  const timeout = setTimeout(function() {
    if (finished) return;

    finished = true;
    delete window[callbackName];
    script.remove();

    processing = false;

    showStatus(
      'TIMEOUT: Google Apps Script did not respond. Check your deployment URL and permissions.',
      'error'
    );

    document.getElementById('againButton').hidden = false;

  }, 20000);

  window[callbackName] = function(result) {

    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    delete window[callbackName];
    script.remove();

    processing = false;

    if (result && result.success) {

      let message =
        'LEARNER SUCCESSFULLY MARKED SAFE!\n\n' +
        result.name +
        '\n' + result.message;

      if (result.scannedAt) {
        message += '\nScanned: ' + result.scannedAt;
      }

      if (result.sms) {
        message += '\nSMS: ' + result.sms;
      }

      showStatus(message, 'success');

    } else {
      showStatus(
        'SERVER ERROR: ' +
        (result ? result.message : 'Invalid response'),
        'error'
      );
    }

    document.getElementById('againButton').hidden = false;
  };

  script.onerror = function() {

    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    delete window[callbackName];
    script.remove();

    processing = false;

    showStatus(
      'GOOGLE APPS SCRIPT CONNECTION FAILED. The request could not load. Verify the deployed /exec URL and web app access settings.',
      'error'
    );

    document.getElementById('againButton').hidden = false;
  };

  script.src =
    GAS_URL +
    '?action=scan' +
    '&token=' + encodeURIComponent(token) +
    '&callback=' + callbackName;

  document.body.appendChild(script);
}

async function scanAgain() {

  document.getElementById('againButton').hidden = true;

  showStatus('Ready to scan another learner.', '');

  await startScanner();
}

</script>

</body>
</html>
