
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Learner Safety QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #f0fdf4;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #14532d;
  }

  .container {
    max-width: 500px;
    margin: 20px auto;
    padding: 22px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 5px 20px #0001;
  }

  h1 { font-size: 23px; }

  #reader {
    width: 100%;
    margin: 20px auto;
  }

  button {
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #166534;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin: 5px;
  }

  button:disabled {
    opacity: .5;
  }

  #status {
    margin: 15px 0;
    font-weight: bold;
  }

  .note {
    font-size: 13px;
    color: #64748b;
    line-height: 1.6;
  }
</style>
</head>

<body>

<div class="container">

  <h1>LEARNER SAFETY</h1>
  <h3>QR CODE SCANNER</h3>

  <p>Scan the learner's QR code to record their safety status.</p>

  <div id="reader"></div>

  <div id="status">Ready to scan.</div>

  <button id="startButton" onclick="startScanner()">
    START CAMERA
  </button>

  <button onclick="stopScanner()">
    STOP CAMERA
  </button>

  <p class="note">
    Allow camera permission when requested.
    After scanning, the system will open the
    official safety confirmation page.
  </p>

</div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbzgFuR_SwJ-ewwwR0SyJ1pwyI2USRJk8_1gmYAT1W7_yNP0y2Yvibz1pkwlRO3Orgde/exec';

let scanner = null;
let scanning = false;
let processing = false;

async function startScanner() {

  if (processing || scanning) return;

  document.getElementById('status').textContent =
    'Opening camera...';

  try {
    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess,
      function() {}
    );

    scanning = true;

    document.getElementById('status').textContent =
      'Camera active. Scan a learner QR code.';

  } catch(error) {
    document.getElementById('status').textContent =
      'Camera error: ' + error;
  }
}

async function stopScanner() {
  if (scanner && scanning) {
    try {
      await scanner.stop();
      scanning = false;
    } catch(error) {
      console.log(error);
    }
  }
}

async function onScanSuccess(decodedText) {

  if (processing) return;

  let token = '';

  try {
    const scannedUrl = new URL(decodedText);

    // Only accept the official Apps Script scan URL.
    if (
      scannedUrl.origin !==
      'https://script.google.com'
    ) {
      throw new Error('Unrecognized QR code.');
    }

    if (
      scannedUrl.pathname.indexOf('/macros/s/') !== 0 ||
      scannedUrl.searchParams.get('action') !== 'scan'
    ) {
      throw new Error('Invalid safety QR code.');
    }

    token = scannedUrl.searchParams.get('token');

    if (!token || !/^[a-f0-9-]{36}$/i.test(token)) {
      throw new Error('Invalid learner token.');
    }

  } catch(error) {
    document.getElementById('status').textContent =
      error.message;
    return;
  }

  processing = true;

  document.getElementById('status').textContent =
    'QR recognized. Processing safety record...';

  await stopScanner();

  window.location.href =
    GAS_URL + '?action=scan&token=' +
    encodeURIComponent(token);
}

</script>

</body>
</html>
