
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
 content="width=device-width, initial-scale=1">

<title>Learner Safety QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0001;
  text-align: center;
}

h2 {
  color: #166534;
}

#reader {
  width: 100%;
  margin: 20px auto;
  overflow: hidden;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  margin: 6px 0;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.start {
  background: #15803d;
  color: white;
}

.stop {
  background: #dc2626;
  color: white;
}

.another {
  background: #2563eb;
  color: white;
}

.back {
  background: #e2e8f0;
  color: #172033;
}

#result {
  display: none;
  padding: 18px;
  margin: 15px 0;
  border-radius: 12px;
  background: #f0fdf4;
}

#result.error {
  background: #fef2f2;
}

#result h3 {
  margin-top: 0;
}

.successText {
  color: #15803d;
}

.errorText {
  color: #dc2626;
}

.small {
  font-size: 12px;
  color: #64748b;
}

</style>
</head>

<body>

<div class="container">

  <h2>LEARNER SAFETY</h2>

  <p>QR Code Monitoring Scanner</p>

  <p class="small" id="connection">
    Checking teacher session...
  </p>

  <div id="reader"></div>

  <button class="start" id="startBtn"
    onclick="startCamera()">
    START CAMERA
  </button>

  <button class="stop" id="stopBtn"
    onclick="stopCamera()" disabled>
    STOP CAMERA
  </button>

  <div id="result"></div>

  <button class="another" id="anotherBtn"
    onclick="scanAnother()" disabled>
    SCAN ANOTHER LEARNER
  </button>

  <button class="back" onclick="backDashboard()">
    BACK TO DASHBOARD
  </button>

  <p class="small">
    Scan the learner's assigned QR code to record
    the learner as SAFE.
  </p>

</div>

<script>

/************************************************
 CONFIGURATION
************************************************/


const params = new URLSearchParams(window.location.search);

const SESSION = params.get('session') || '';

const API_URL = params.get('api') ||
  'https://script.google.com/macros/s/AKfycbzgFuR_SwJ-ewwwR0SyJ1pwyI2USRJk8_1gmYAT1W7_yNP0y2Yvibz1pkwlRO3Orgde/exec';

const DASHBOARD_URL = params.get('https://script.google.com/macros/s/AKfycbzgFuR_SwJ-ewwwR0SyJ1pwyI2USRJk8_1gmYAT1W7_yNP0y2Yvibz1pkwlRO3Orgde/exec') || '';

const DASHBOARD_SESSION =
  params.get('dashboardSession') || SESSION;


async function validateTeacherSession() {

  if (!SESSION || !API_URL) {

    showMessage(
      'Invalid session. Open the scanner from the teacher dashboard.',
      true
    );

    return false;
  }

  try {

    const url = new URL(API_URL);

    url.searchParams.set('action', 'validateSession');
    url.searchParams.set('session', SESSION);

    const response = await fetch(url.toString());

    const result = await response.json();

    if (!result.valid) {

      showMessage(
        'Teacher session expired. Please log in again.',
        true
      );

      return false;
    }

    return true;

  } catch (error) {

    showMessage(
      'Unable to connect to Google Apps Script.',
      true
    );

    return false;

  }

}

 
let scanner = null;
let scanning = false;
let processing = false;
let lastToken = '';

/************************************************
 INITIALIZE
************************************************/

window.onload = function() {

  const connection =
    document.getElementById('connection');

  if (!SESSION || !API_URL || !DASHBOARD_URL) {

    connection.textContent =
      'Invalid session. Open the scanner from the teacher dashboard.';

    document.getElementById('startBtn').disabled = true;

    return;
  }

  connection.textContent =
    'Teacher session connected. Ready to scan.';

  scanner = new Html5Qrcode('reader');

};

/************************************************
 START CAMERA
************************************************/

async function startCamera() {

  if (!scanner || scanning || processing) return;

  try {

    await scanner.start(

      { facingMode: 'environment' },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      function() {}

    );

    scanning = true;

    document.getElementById('startBtn').disabled = true;

    document.getElementById('stopBtn').disabled = false;

    showMessage(
      'Camera started. Point it at the learner QR code.',
      false
    );

  } catch(error) {

    showMessage(
      'Camera error: ' + error,
      true
    );

  }

}

/************************************************
 STOP CAMERA
************************************************/

async function stopCamera() {

  if (!scanner || !scanning) return;

  try {

    await scanner.stop();

    scanning = false;

    document.getElementById('startBtn').disabled = false;

    document.getElementById('stopBtn').disabled = true;

  } catch(error) {

    console.error(error);

  }

}

/************************************************
 QR SCAN SUCCESS
************************************************/

async function onScanSuccess(decodedText) {

  if (processing) return;

  const token = String(decodedText).trim();

  // Only accept the UUID token format.
  if (!/^[a-f0-9-]{36}$/i.test(token)) {

    showMessage(
      'Invalid learner QR code.',
      true
    );

    return;
  }

  processing = true;
  lastToken = token;

  await stopCamera();

  showMessage(
    'QR detected. Updating learner safety record...',
    false
  );

  sendScanRequest(token);

}

/************************************************
 SEND SCAN REQUEST TO APPS SCRIPT
************************************************/

function sendScanRequest(token) {

  const callbackName =
    'scanCallback_' +
    Date.now() +
    '_' +
    Math.floor(Math.random() * 10000);

  const script = document.createElement('script');

  const timeout = setTimeout(function() {

    cleanup();

    processing = false;

    showMessage(
      'Request timed out. Check your internet connection and try again.',
      true
    );

    document.getElementById('anotherBtn').disabled = false;

  }, 30000);

  function cleanup() {

    clearTimeout(timeout);

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }

  window[callbackName] = function(data) {

    cleanup();

    processing = false;

    if (!data || !data.success) {

      showMessage(
        data ? data.message : 'Scan failed.',
        true
      );

      document.getElementById('anotherBtn').disabled = false;

      return;
    }

    if (data.alreadySafe) {

      showMessage(
        'ALREADY SAFE: ' + data.name +
        '<br>' + data.message +
        '<br>SMS: ' + (data.sms || 'Previously processed'),
        false
      );

    } else {

      showMessage(
        'LEARNER SUCCESSFULLY MARKED SAFE!' +
        '<br><br><strong>' + escapeHTML(data.name) + '</strong>' +
        '<br>Scanned: ' + escapeHTML(data.scannedAt || '') +
        '<br>SMS: ' + escapeHTML(data.sms || 'Not available'),
        false
      );

    }

    document.getElementById('anotherBtn').disabled = false;

  };

  const url = new URL(API_URL);

  url.searchParams.set('action', 'scan');
  url.searchParams.set('token', token);
  url.searchParams.set('session', SESSION);
  url.searchParams.set('callback', callbackName);

  script.src = url.toString();

  script.onerror = function() {

    cleanup();

    processing = false;

    showMessage(
      'Unable to contact the monitoring system.',
      true
    );

    document.getElementById('anotherBtn').disabled = false;

  };

  document.body.appendChild(script);

}

/************************************************
 SCAN ANOTHER LEARNER
************************************************/

async function scanAnother() {

  if (scanning || processing) return;

  lastToken = '';

  document.getElementById('result').style.display = 'none';

  document.getElementById('anotherBtn').disabled = true;

  await startCamera();

}

/************************************************
 BACK TO DASHBOARD
************************************************/


async function backDashboard() {

  if (scanning) {
    await stopCamera();
  }

  // Return to the Apps Script web app.
  // Do not destroy the current teacher session.

  const dashboard =
    params.get('dashboard') || '';

  const session =
    params.get('dashboardSession') || SESSION;

  if (!dashboard || !session) {

    showMessage(
      'Dashboard link or teacher session is missing. Please open the scanner from the teacher dashboard.',
      true
    );

    return;
  }

  const url = new URL(dashboard);

  url.searchParams.set('page', 'dashboard');
  url.searchParams.set('session', session);

  window.location.replace(url.toString());

}


function backDashboard() {

  const dashboard = DASHBOARD_URL;
  const session = DASHBOARD_SESSION;

  if (!dashboard || !session) {
    showMessage(
      'Dashboard session information is missing.',
      true
    );
    return;
  }

  const url = new URL(dashboard);

  url.searchParams.set('page', 'dashboard');
  url.searchParams.set('session', session);

  window.location.href = url.toString();

}

 
/************************************************
 RESULT DISPLAY
************************************************/

function showMessage(message, error) {

  const result =
    document.getElementById('result');

  result.style.display = 'block';

  result.className = error ? 'error' : '';

  result.innerHTML =
    '<h3 class="' +
    (error ? 'errorText' : 'successText') +
    '">' +
    (error ? 'SCAN FAILED' : 'SCAN RESULT') +
    '</h3>' +
    '<p>' + message + '</p>';

}

/************************************************
 HTML ESCAPING
************************************************/

function escapeHTML(value) {

  return String(value ?? '').replace(
    /[&<>"']/g,
    function(c) {

      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c];

    }
  );

}

</script>

</body>
</html>
